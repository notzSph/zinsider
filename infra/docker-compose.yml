services:
  zinsider:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: zinsider:latest
    env_file:
      - .env
    environment:
      TD_OUTPUTSIZE: ${TD_OUTPUTSIZE:-20}
      TD_MAX_RETRIES: ${TD_MAX_RETRIES:-3}
      TD_RETRY_BACKOFF_SECONDS: ${TD_RETRY_BACKOFF_SECONDS:-2.0}
      TD_BASE_URL: ${TD_BASE_URL:-https://api.twelvedata.com}
      STATE_DIR: /app/state
      DB_PATH: /app/data/zinsider.sqlite3
    ports:
      - "127.0.0.1:${ZINSIDER_PORT:-8080}:8080"
    volumes:
      - state:/app/state
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    image: zinsider:latest
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
      DB_PATH: /app/data/zinsider.sqlite3
    command: ["scheduler"]
    volumes:
      - state:/app/state
      - data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  state:
  data:
